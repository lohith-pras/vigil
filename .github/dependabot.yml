version: 2
updates:
  # Keeps the SHA-pinned actions in build.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /src/Vigil
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
