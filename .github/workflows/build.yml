name: build

# Every push to main builds the exe (download it from the run's Artifacts).
# Pushing a tag like v0.1.0 also publishes a GitHub Release with both exes.
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older build of the same branch that's still queued or running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: echo "VERSION_ARGS=-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV

      # Small exe; needs the .NET 10 Desktop Runtime installed.
      - name: Publish (framework-dependent)
        run: dotnet publish src/Vigil -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none ${{ env.VERSION_ARGS }} -o out/fd

      # Big exe; runs with nothing installed. Not compressed: compression unpacks the whole
      # bundle into RAM at start (measured: 86 MB idle vs 10 MB uncompressed).
      - name: Publish (self-contained)
        run: dotnet publish src/Vigil -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none ${{ env.VERSION_ARGS }} -o out/sc

      # Run the real exe: open the panel, click through everything, screenshot it.
      # Any exception fails the build, so a broken exe never reaches a release.
      - name: Self-test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process out/sc/Vigil.exe -ArgumentList '--selftest', "$pwd/selftest" -Wait -PassThru
          Get-Content selftest/report.txt
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }

      # Informational: memory of each build flavour (never blocks a release).
      - name: Memory test
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 4
        run: |
          $variants = [ordered]@{ 'small Vigil.exe' = 'out/fd/Vigil.exe'; 'standalone' = 'out/sc/Vigil.exe' }
          foreach ($name in $variants.Keys) {
            $log = Join-Path $pwd "mem.txt"; Remove-Item $log -ErrorAction Ignore
            $p = Start-Process $variants[$name] -ArgumentList '--memtest', $log -PassThru
            $samples = @()
            while (-not $p.HasExited) {
              $c = Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)" -ErrorAction Ignore
              if ($c) { $samples += [int]($c.WorkingSetPrivate / 1MB) }
              Start-Sleep -Seconds 1
            }
            "==== $name ($([math]::Round((Get-Item $variants[$name]).Length / 1MB, 1)) MB on disk)"
            Get-Content $log -ErrorAction Ignore
            "Task Manager 'Memory' (private working set) per second: $($samples -join ' ')"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest/

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/fd/Vigil.exe dist/Vigil.exe
          Copy-Item out/sc/Vigil.exe dist/Vigil-standalone.exe
          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - uses: actions/upload-artifact@v4
        with:
          name: Vigil
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # If the release already exists (e.g. created by hand), just replace its files.
        run: |
          gh release create ${{ github.ref_name }} dist/Vigil.exe dist/Vigil-standalone.exe --generate-notes
          if ($LASTEXITCODE -ne 0) { gh release upload ${{ github.ref_name }} dist/Vigil.exe dist/Vigil-standalone.exe --clobber }
